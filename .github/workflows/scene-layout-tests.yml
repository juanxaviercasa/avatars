name: Scene-aware reel editor checks
on:
  push:
    branches: [main]
    paths:
      - 'viralforge/render/**'
      - 'viralforge/video_polisher.py'
      - 'test_scene_layout.py'
      - 'test_overlay_safety.py'
      - 'test_golden_master.py'
      - 'test_reference_master.py'
      - 'test_canvas_layout.py'
      - 'test_quality_gate.py'
      - 'test_audio_alignment.py'
      - '.github/workflows/scene-layout-tests.yml'
  pull_request:
    paths:
      - 'viralforge/render/**'
      - 'viralforge/video_polisher.py'
      - 'test_scene_layout.py'
      - 'test_overlay_safety.py'
      - 'test_golden_master.py'
      - 'test_reference_master.py'
      - 'test_canvas_layout.py'
      - 'test_quality_gate.py'
      - 'test_audio_alignment.py'
jobs:
  layout-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pillow numpy imageio-ffmpeg matplotlib
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: ffmpeg -version && ffprobe -version
      - run: python -m compileall -q viralforge/render viralforge/video_polisher.py
      - run: python -m unittest -v test_scene_layout test_overlay_safety test_golden_master test_canvas_layout test_reference_master test_quality_gate test_audio_alignment
