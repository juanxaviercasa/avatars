name: Scene-aware reel editor checks
on:
  push:
    branches: [main]
    paths:
      - 'viralforge/render/**'
      - 'viralforge/video_polisher.py'
      - 'test_scene_layout.py'
      - 'test_overlay_safety.py'
      - '.github/workflows/scene-layout-tests.yml'
  pull_request:
    paths:
      - 'viralforge/render/**'
      - 'viralforge/video_polisher.py'
      - 'test_scene_layout.py'
      - 'test_overlay_safety.py'
jobs:
  layout-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pillow numpy imageio-ffmpeg
      - run: python -m compileall -q viralforge/render viralforge/video_polisher.py
      - run: python -m unittest -v test_scene_layout test_overlay_safety
